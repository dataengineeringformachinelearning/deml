{% load static %}
{# Backend chrome navbar — deml-ui site-navbar contract (new-from-the-start). #}
<script>
  window.__DEML = {
    ...(window.__DEML || {}),
    FRONTEND_URL: "{{ frontend_url|escapejs }}",
    BACKEND_URL: "{{ request.scheme }}://{{ request.get_host }}",
    MARKETING_URL: "{{ marketing_url|escapejs }}",
    USE_ALGOLIA_SEARCH: true,
  };
</script>
<header class="site-navbar" id="navbar">
  <div class="site-navbar-branding">
    <a
      href="{{ marketing_url }}/"
      class="site-navbar-icon"
      aria-label="Go to homepage"
      id="navbar-brand-link"
    >
      DEML
    </a>
  </div>

  <button
    type="button"
    class="site-navbar-menu-toggle"
    id="mobile-menu-btn"
    aria-label="Toggle navigation menu"
    aria-controls="site-navbar-panel"
    aria-expanded="false"
  >
    Menu
  </button>

  <div class="site-navbar-panel" id="site-navbar-panel">
    <nav class="main-navigation" aria-label="Main navigation" id="mobile-menu">
      <ul class="row wrap items-center justify-center gap-4" role="list" id="site-navbar-menu">
        <li>
          <a href="{{ frontend_url }}/blog" data-nav-id="blog">Blog</a>
        </li>
        <li>
          <a href="https://dataengineeringformachinelearning.com/book/" data-nav-id="book">Book</a>
        </li>
        <li>
          <a href="{{ frontend_url }}/dashboard" data-nav-id="dashboard" data-require-auth="true" hidden>Dashboard</a>
        </li>
        <li>
          <a href="{{ frontend_url }}/settings" data-nav-id="settings" data-require-auth="true" hidden>Settings</a>
        </li>
      </ul>
    </nav>

    <div class="button-group" role="group" aria-label="Account actions">
      <button
        type="button"
        class="button button--secondary navbar-search-trigger"
        id="navbar-search-trigger"
        aria-label="Open search (⌘K)"
      >
        Search
      </button>
      <button
        type="button"
        class="theme-toggle"
        id="theme-toggle-btn"
        aria-label="Toggle light and dark theme"
        aria-pressed="false"
      >
        Theme
      </button>
      <a
        class="button button--primary auth-btn"
        href="{{ frontend_url }}/login"
        id="auth-btn-desktop"
      >
        <span id="auth-text-desktop">Sign In</span>
      </a>
      <button
        type="button"
        class="button button--secondary auth-btn auth-signout-btn"
        id="auth-signout-desktop"
        hidden
      >
        Sign Out
      </button>
      {# Mobile auth mirrors (kept for navbar.js selectors) #}
      <a
        class="button button--primary auth-btn"
        href="{{ frontend_url }}/login"
        id="auth-btn-mobile"
        hidden
      >
        <span id="auth-text-mobile">Sign In</span>
      </a>
      <button
        type="button"
        class="button button--secondary auth-btn auth-signout-btn"
        id="auth-signout-mobile"
        hidden
      >
        Sign Out
      </button>
    </div>
  </div>
</header>
<div id="autocomplete" class="algolia-autocomplete-host" aria-hidden="true"></div>
<script src="{% static 'widgets/navbar.js' %}" defer></script>
<script type="module" src="{% static 'deml-ui-elements.js' %}"></script>
<script src="{% static 'widgets/command-palette.js' %}" defer></script>
<script src="{% static 'widgets/algolia-search.js' %}" defer></script>
