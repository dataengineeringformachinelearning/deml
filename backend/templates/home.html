{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DEML — Accounts and status API</title>
    <meta
      name="description"
      content="DEML API for accounts, authentication, and public status pages."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="{{ request.build_absolute_uri }}" />
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml" />
    <link rel="icon" href="{% static 'favicon-96x96.png' %}" sizes="96x96" type="image/png" />
    <meta name="theme-color" content="#35312D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#D4CEC5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#35312D" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />
    <meta property="og:title" content="DEML — Accounts and status API" />
    <meta
      property="og:description"
      content="DEML API for accounts, authentication, and public status pages."
    />
    <meta
      property="og:image"
      content="{{ request.scheme }}://{{ request.get_host }}{% static 'dataengineeringformachinelearning-social.png' %}"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:site_name" content="DEML" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DEML — Accounts and status API" />
    <meta
      name="twitter:description"
      content="DEML API for accounts, authentication, and public status pages."
    />
    <meta
      name="twitter:image"
      content="{{ request.scheme }}://{{ request.get_host }}{% static 'dataengineeringformachinelearning-social.png' %}"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebAPI",
        "name": "DEML Backend API",
        "description": "API for DEML accounts, authentication, and status page management.",
        "url": "{{ request.scheme }}://{{ request.get_host }}/",
        "documentation": "{{ marketing_url }}/documentation"
      }
    </script>
    <link rel="stylesheet" href="{% static 'geist.css' %}" />
    <link rel="stylesheet" href="{% static 'deml-ui.css' %}" />
    <link rel="stylesheet" href="{% static 'suite-backend.css' %}" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('deml-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="suite-backend-splash backend-splash">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main id="main-content" class="suite-backend-shell backend-splash-shell" tabindex="-1">
      <a
        class="suite-backend-logo backend-splash-logo"
        href="{{ frontend_url }}/"
        aria-label="DEML home"
      >
        <img
          class="suite-media"
          src="{% static 'dataengineeringformachinelearning.svg' %}"
          width="270"
          height="270"
          alt="DEML"
          decoding="async"
          fetchpriority="high"
          loading="eager"
        />
      </a>
    </main>
  </body>
</html>
