# Local user control plane only. FORJD owns sealed ingest, projections, and ML.
# See docs/FORJD_INTEGRATION.md and config/deml.catalog.json.
#
# First time / after contracts change:
#   npm run sync:contracts:docker
#   docker compose up --build
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: machinelearning
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d machinelearning"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PORT: "8000"
      DEBUG: "True"
      SECRET_KEY: local-compose-only-not-for-production
      DATABASE_URL: ${DATABASE_URL:-postgres://admin:password@postgres:5432/machinelearning}
      FRONTEND_URL: http://localhost:4200
      BACKEND_URL: http://localhost:8000
      MARKETING_URL: http://localhost:4321
      STRUCTURED_LOGS: "true"
      FORJD_API_URL: ${FORJD_API_URL:-https://backend.forjd.co}
      FORJD_SERVICE_TOKEN: ${FORJD_SERVICE_TOKEN:-}
      FORJD_TENANT_ID: ${FORJD_TENANT_ID:-}
      FORJD_WRITE_MODE: ${FORJD_WRITE_MODE:-forjd}
      FORJD_READ_MODE: ${FORJD_READ_MODE:-forjd}
      FORJD_CUTOVER_PHASE: ${FORJD_CUTOVER_PHASE:-2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
