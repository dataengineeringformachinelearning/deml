<app-banner
  preheader="DEML"
  heading="Success"
  lede="Your action completed successfully."
>
  <app-button-group>
    <app-button variant="primary" shape="pill" routerLink="/dashboard">Open dashboard</app-button>
    <app-button variant="secondary" shape="pill" routerLink="/settings">Settings</app-button>
  </app-button-group>
</app-banner>

<app-page-section variant="catalog" labelledBy="success-heading">
  <app-section-header
    eyebrow="Checkout"
    heading="Next steps"
    lede="Continue with a surface that matches your next task."
    headingId="success-heading"
  />

  <app-card-grid>
    @for (card of cards; track card.id) {
      <app-card
        [heading]="card.heading"
        [subtext]="card.subtext"
        [visual]="card.visual"
      >
        <app-button-group align="center" layout="row">
          <app-button variant="primary" shape="pill" [routerLink]="card.href">
            {{ card.cta }}
          </app-button>
        </app-button-group>
      </app-card>
    }
  </app-card-grid>
</app-page-section>
