<app-page-section variant="auth" ariaLabel="Sign up">
  <app-form-panel title="Create account" description="Name, email, and password.">
    <form class="form-panel__form" (submit)="submit($event)" novalidate>
      <app-text-field
        label="Name"
        type="text"
        name="name"
        autocomplete="name"
        placeholder="Your name"
        [required]="true"
        [value]="name()"
        (valueChange)="name.set($event)"
        [error]="nameError()"
      />

      <app-text-field
        label="Email"
        type="email"
        name="email"
        autocomplete="email"
        placeholder="you@example.com"
        [required]="true"
        [value]="email()"
        (valueChange)="email.set($event)"
        [error]="emailError()"
      />

      <app-text-field
        label="Password"
        type="password"
        name="password"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        [required]="true"
        [value]="password()"
        (valueChange)="password.set($event)"
        [error]="passwordError()"
      />

      <app-text-field
        label="Confirm password"
        type="password"
        name="confirmPassword"
        autocomplete="new-password"
        placeholder="Repeat password"
        [required]="true"
        [value]="confirmPassword()"
        (valueChange)="confirmPassword.set($event)"
        [error]="confirmError()"
      />

      <p class="form-panel__note">
        By creating an account you agree to the
        <a
          href="https://dataengineeringformachinelearning.com/terms/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Terms
        </a>.
      </p>

      @if (formError()) {
        <p class="form-panel__error" role="alert">{{ formError() }}</p>
      }

      <app-button-group align="start" layout="column">
        <app-button variant="primary" shape="pill" type="submit" [busy]="busy()">
          Sign up
        </app-button>
      </app-button-group>
    </form>

    <p formFooter>
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>
  </app-form-panel>
</app-page-section>
