<app-banner
  [heading]="page()?.title || 'Status'"
  [lede]="page()?.description || ''"
/>

<app-page-section variant="catalog" ariaLabel="Status page">
  <div class="explore-directory">
    @if (!online()) {
      <app-callout
        tone="warning"
        [heading]="offlineHeading"
        [text]="offlineBody"
      />
      @if (servingStale()) {
        <app-callout tone="info" [text]="staleStatus" />
      }
    } @else if (servingStale()) {
      <app-callout tone="info" [text]="staleStatus" />
    }

    @if (loadFailed()) {
      @if (loadErrorKind() === 'not_found') {
        <app-error-state title="Not found" description="This page isn’t published.">
          <app-button variant="primary" shape="pill" routerLink="/explore">Explore</app-button>
        </app-error-state>
      } @else if (loadErrorKind() === 'forbidden') {
        <app-error-state title="Private" description="Log in with an authorized account.">
          <app-button variant="primary" shape="pill" routerLink="/login">Log in</app-button>
        </app-error-state>
      } @else {
        <app-error-state
          title="Unable to load"
          description="Check your connection, then try again."
        >
          <app-button
            variant="primary"
            shape="pill"
            [busy]="isRetrying()"
            (pressed)="retryLoad()"
          >
            {{ retryLabel }}
          </app-button>
        </app-error-state>
      }
    } @else if (isLoading()) {
      <div class="explore-card explore-card--loading" aria-busy="true" aria-live="polite">
        <app-skeleton [block]="true" />
      </div>
    } @else if (page(); as current) {
      <app-explore-card
        layout="detail"
        [title]="current.title"
        [description]="current.description || ''"
        [tag]="pageTag()"
        [proVerified]="!!current.is_pro_verified"
        [status]="globalStatus()"
        [statusLabel]="statusLabel()"
        [metricGroups]="metricGroups()"
        [services]="services()"
        [incidents]="incidents()"
        [uptimeHistory]="uptimeHistory()"
        [uptimePercentage]="uptimePercentage()"
        [uptimeSummary]="uptimeSummary()"
        uptimeLabel="Platform uptime"
      />
    }
  </div>
</app-page-section>
