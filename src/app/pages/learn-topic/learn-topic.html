@if (topic(); as entry) {
  <app-article
    [title]="entry.title"
    [lede]="entry.meta"
    [body]="entry.body"
    backLink="/learn"
    backLabel="All topics"
    [headingId]="headingId()"
  >
    @if (githubHref(); as href) {
      <app-button variant="primary" shape="pill" [href]="href">Star on GitHub</app-button>
    }
  </app-article>
} @else {
  <app-article
    backLink="/learn"
    backLabel="Back to Learn"
    missingHeading="Topic not found"
    missingLede="That package is not in the catalog."
  />
}
