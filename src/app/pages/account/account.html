<app-banner
  preheader="DEML"
  heading="Account"
  lede="Profile and account settings."
>
  <app-button-group>
    <app-button variant="primary" shape="pill" routerLink="/sites">Manage sites</app-button>
    <app-button variant="secondary" shape="pill" (pressed)="toggleTheme()">
      {{ isDark() ? 'Use light mode' : 'Use dark mode' }}
    </app-button>
  </app-button-group>
</app-banner>

<section class="page-body page-body--catalog account" aria-labelledby="account-heading">
  <app-section-header
    eyebrow="Settings"
    heading="Your account"
    lede="Preferences, security, and recent activity — same components as the rest of DEML."
    headingId="account-heading"
  />

  <app-dashboard-grid>
    <app-stat-card
      size="sm"
      accent="primary"
      label="Plan"
      value="Pro"
      meta="Workspace seat"
    />

    <app-stat-card
      size="sm"
      accent="gold"
      label="Sites linked"
      value="3"
      meta="Live, staging, preview"
    />

    <app-stat-card
      size="sm"
      accent="red"
      label="Theme"
      [value]="isDark() ? 'Dark' : 'Light'"
      meta="Applies across the app"
    />

    <app-chart-card
      size="wide"
      accent="primary"
      heading="Recent activity"
      meta="Account timeline"
    >
      <app-metric-list
        [items]="activity"
        accent="primary"
        ariaLabel="Recent account activity"
      />
    </app-chart-card>
  </app-dashboard-grid>

  <app-section-header
    heading="Preferences"
    lede="Open a card to manage that area of your account."
    headingId="account-prefs-heading"
  />

  <app-card-grid>
    @for (pref of prefs; track pref.id) {
      <app-card
        [heading]="pref.heading"
        [subtext]="pref.subtext"
        [visual]="pref.visual"
      >
        <app-button-group align="center" layout="row">
          <app-button variant="primary" shape="pill" [routerLink]="pref.href">
            {{ pref.cta }}
          </app-button>
        </app-button-group>
      </app-card>
    }
  </app-card-grid>
</section>
