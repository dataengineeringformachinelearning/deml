<app-banner
  variant="hero"
  [preheader]="hero.preheader"
  [heading]="hero.heading"
  [lede]="hero.lede"
>
  <app-button-group>
    @if (!loggedIn()) {
      <app-button variant="primary" shape="pill" routerLink="/explore">Explore</app-button>
      <app-button variant="secondary" shape="pill" routerLink="/login">Log in</app-button>
    } @else {
      <app-button variant="primary" shape="pill" routerLink="/settings">Settings</app-button>
    }
  </app-button-group>
</app-banner>
