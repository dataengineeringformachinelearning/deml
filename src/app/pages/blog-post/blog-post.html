@if (post(); as entry) {
  <app-banner
    [preheader]="entry.publishedLabel"
    [heading]="entry.title"
    [lede]="entry.summary"
    [headingId]="headingId()"
  >
    <app-button variant="secondary" shape="pill" routerLink="/blog">All posts</app-button>
  </app-banner>

  <app-page-section variant="prose" [labelledBy]="headingId()">
    @if (entry.headings.length > 1) {
      <nav class="toc" aria-label="On this page">
        <ol class="toc__list">
          @for (heading of entry.headings; track heading.slug) {
            <li>
              <a class="toc__item" [href]="'#' + heading.slug">
                <span class="toc__label">{{ heading.text }}</span>
              </a>
            </li>
          }
        </ol>
      </nav>
    }

    <div class="article-body" [innerHTML]="safeHtml()"></div>

    <nav class="pagination" aria-label="Blog navigation">
      @if (older(); as prev) {
        <a class="pagination__prev" [routerLink]="['/blog', prev.slug]" rel="prev">
          Earlier: {{ prev.title }}
        </a>
      }
      @if (newer(); as next) {
        <a class="pagination__next" [routerLink]="['/blog', next.slug]" rel="next">
          Newer: {{ next.title }}
        </a>
      }
    </nav>
  </app-page-section>
} @else {
  <app-banner heading="Post not found" lede="That post is not in the archive.">
    <app-button variant="primary" shape="pill" routerLink="/blog">All posts</app-button>
  </app-banner>
}
