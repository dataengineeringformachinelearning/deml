<app-banner
  preheader="DEML · Built in public"
  heading="Blog"
  lede="Releases, architecture decisions, reliability work, and the details that turn a platform into durable infrastructure."
>
  <app-button-group>
    <app-button variant="secondary" shape="pill" href="/blog/rss.xml">Follow via RSS</app-button>
  </app-button-group>
</app-banner>

<app-page-section variant="catalog" labelledBy="blog-list-heading">
  <app-section-header
    eyebrow="Archive"
    heading="All posts"
    lede="Newest first."
    headingId="blog-list-heading"
  />

  <app-microcard-grid ariaLabel="Blog archive" [columns]="1">
    @for (post of notes; track post.slug) {
      <li>
        <app-microcard
          [heading]="post.title"
          [subtext]="post.summary"
          [meta]="post.note + ' · ' + post.meta"
          [visual]="post.visual"
          [headingId]="'blog-' + post.slug"
          [routerLink]="['/blog', post.slug]"
          cta="Read"
        />
      </li>
    }
  </app-microcard-grid>
</app-page-section>
