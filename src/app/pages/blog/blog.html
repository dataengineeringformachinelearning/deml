<app-banner
  preheader="DEML"
  heading="Blog"
  lede="Notes and writing on clarity, craft, and calm software."
/>

<section class="page-body page-body--catalog blog-list" aria-labelledby="blog-list-heading">
  <app-section-header
    heading="Latest"
    lede="Essays and notes, newest first."
    headingId="blog-list-heading"
  />

  <ul class="blog-microcards" role="list">
    @for (post of posts; track post.slug) {
      <li class="blog-microcards-item">
        <app-microcard
          [heading]="post.title"
          [subtext]="post.excerpt"
          [meta]="post.meta"
          [visual]="post.visual"
          [headingId]="'blog-' + post.slug"
          [routerLink]="['/blog', post.slug]"
          cta="Read"
        />
      </li>
    }
  </ul>
</section>
