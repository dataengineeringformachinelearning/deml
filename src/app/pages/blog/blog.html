<app-banner heading="Blog" lede="Field notes. Newest first.">
  <app-button variant="secondary" shape="pill" href="/blog/rss.xml">RSS</app-button>
</app-banner>

<app-page-section variant="catalog" ariaLabel="Blog archive">
  <app-microcard-grid ariaLabel="Blog archive" [columns]="1">
    @for (post of notes; track post.slug) {
      <li>
        <app-microcard
          [heading]="post.title"
          [subtext]="post.summary"
          [meta]="post.meta"
          [headingId]="'blog-' + post.slug"
          [routerLink]="['/blog', post.slug]"
          [cta]="''"
        />
      </li>
    }
  </app-microcard-grid>
</app-page-section>
