<div class="page-body page-body--catalog">
  <app-banner preheader="DEML" heading="Not found" [lede]="note()" />
  <app-page-section variant="catalog" labelledBy="not-found-heading">
    <app-section-header
      eyebrow="404"
      heading="Not found"
      [lede]="note()"
      headingId="not-found-heading"
    />
    <app-dashboard-grid>
      @for (metric of metrics(); track metric.label) {
        <app-stat-card [label]="metric.label" [value]="metric.value" />
      }
    </app-dashboard-grid>
  </app-page-section>
</div>
