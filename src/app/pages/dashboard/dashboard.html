<app-banner
  preheader="DEML"
  heading="Dashboard"
  lede="Live pulse of your workspace — listeners, sessions, and what people open."
/>

<app-page-section variant="catalog" labelledBy="dashboard-heading">
  <app-section-header
    eyebrow="Pulse"
    heading="Overview"
    lede="Last 28 days · demo metrics"
    headingId="dashboard-heading"
  />

  <app-dashboard-grid>
    @for (tile of tiles; track tile.id) {
      @switch (tile.kind) {
        @case ('stat') {
          <app-stat-card
            [size]="tile.size"
            [accent]="tile.accent"
            [label]="tile.label"
            [value]="tile.value"
            [delta]="tile.delta"
            [meta]="tile.meta"
            [sparkline]="tile.sparkline"
          />
        }
        @case ('area') {
          <app-chart-card
            [size]="tile.size"
            [accent]="tile.accent"
            [heading]="tile.heading"
            [meta]="tile.meta"
          >
            <app-area-chart
              [points]="tile.points"
              [accent]="tile.accent"
              [ariaLabel]="tile.ariaLabel"
            />
          </app-chart-card>
        }
        @case ('bar') {
          <app-chart-card
            [size]="tile.size"
            [accent]="tile.accent"
            [heading]="tile.heading"
            [meta]="tile.meta"
          >
            <app-bar-chart
              [items]="tile.items"
              [accent]="tile.accent"
              [ariaLabel]="tile.ariaLabel"
            />
          </app-chart-card>
        }
        @case ('metrics') {
          <app-chart-card
            [size]="tile.size"
            [accent]="tile.accent"
            [heading]="tile.heading"
            [meta]="tile.meta"
          >
            <app-metric-list
              [items]="tile.items"
              [accent]="tile.accent"
              [ariaLabel]="tile.ariaLabel"
            />
          </app-chart-card>
        }
      }
    }
  </app-dashboard-grid>
</app-page-section>
