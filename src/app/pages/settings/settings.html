<app-banner
  preheader="DEML"
  heading="Settings"
  lede="Tune account preferences, security, and delivery."
/>

<app-page-section variant="catalog" labelledBy="settings-heading">
  <app-section-header
    eyebrow="Account"
    heading="Controls"
    lede="Preference modules keep every settings surface aligned."
    headingId="settings-heading"
  />

  <app-card-grid>
    @for (card of cards; track card.id) {
      <app-card
        [heading]="card.heading"
        [subtext]="card.subtext"
        [visual]="card.visual"
      >
        <app-button-group align="center" layout="row">
          <app-button variant="primary" shape="pill" [routerLink]="card.href">
            {{ card.cta }}
          </app-button>
        </app-button-group>
      </app-card>
    }
  </app-card-grid>
</app-page-section>
