<app-banner
  preheader="DEML"
  heading="Auth status"
  [lede]="note()"
>
  <app-button-group>
    <app-button variant="primary" shape="pill" routerLink="/settings">Settings</app-button>
    <app-button variant="secondary" shape="pill" routerLink="/login">Log in</app-button>
  </app-button-group>
</app-banner>

<app-page-section variant="catalog" labelledBy="auth-status-heading">
  <app-section-header
    eyebrow="Session"
    heading="Where to go"
    lede="Identity and session controls for this browser."
    headingId="auth-status-heading"
  />

  <app-card-grid>
    @for (card of cards; track card.id) {
      <app-card
        [heading]="card.heading"
        [subtext]="card.subtext"
        [visual]="card.visual"
      >
        <app-button-group align="center" layout="row">
          <app-button variant="primary" shape="pill" [routerLink]="card.href">
            {{ card.cta }}
          </app-button>
        </app-button-group>
      </app-card>
    }
  </app-card-grid>
</app-page-section>
