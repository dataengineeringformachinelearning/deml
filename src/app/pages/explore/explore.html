<app-banner
  preheader="DEML"
  heading="Explore"
  lede="Browse platform surfaces and documentation paths."
/>

<app-page-section variant="catalog" labelledBy="explore-heading">
  <app-section-header
    eyebrow="Catalog"
    heading="Surfaces"
    lede="Entry points composed from the shared card grid."
    headingId="explore-heading"
  />

  <app-card-grid>
    @for (card of cards; track card.id) {
      <app-card
        [heading]="card.heading"
        [subtext]="card.subtext"
        [visual]="card.visual"
      >
        <app-button-group align="center" layout="row">
          <app-button
            [variant]="card.ctaVariant ?? 'primary'"
            shape="pill"
            [routerLink]="card.href"
          >
            {{ card.cta }}
          </app-button>
        </app-button-group>
      </app-card>
    }
  </app-card-grid>
</app-page-section>
