<app-banner heading="Explore" lede="Browse public status pages from teams using DEML." />

<app-page-section variant="catalog" ariaLabel="Status directory">
  <div class="explore-directory">
    @if (!online()) {
      <app-callout
        tone="warning"
        [heading]="offlineHeading"
        [text]="offlineBody"
      />
      @if (servingStale()) {
        <app-callout tone="info" [text]="staleDirectory" />
      }
    } @else if (servingStale()) {
      <app-callout tone="info" [text]="staleDirectory" />
    }

    @if (loadFailed()) {
      <app-error-state
        title="Unable to load"
        description="Check your connection, then try again."
      >
        <app-button
          variant="primary"
          shape="pill"
          [busy]="isRetrying()"
          (pressed)="retryLoad()"
        >
          {{ retryLabel }}
        </app-button>
      </app-error-state>
    } @else if (isLoading()) {
      <div class="explore-card explore-card--loading" aria-busy="true" aria-live="polite">
        <app-skeleton [block]="true" />
      </div>
    } @else if (statusPages().length === 0) {
      <app-empty-state
        title="Nothing published"
        description="Publish a status page from Settings."
      >
        <app-button variant="primary" shape="pill" routerLink="/settings">Settings</app-button>
      </app-empty-state>
    } @else {
      @for (page of statusPages(); track page.id) {
        <app-explore-card
          [title]="page.title"
          [description]="page.description || ''"
          [href]="getPageUrl(page)"
          [tag]="pageTag(page)"
          [proVerified]="!!page.is_pro_verified"
          [status]="getPageStatus(page)"
          [statusLabel]="getPageStatusLabel(page)"
          [metrics]="exploreMetrics(page)"
          [uptimeHistory]="exploreUptimeHistory(page)"
          [uptimePercentage]="overallUptime(page)"
          [uptimeSummary]="uptimeSummaryFor(page)"
        />
      }
    }
  </div>
</app-page-section>
