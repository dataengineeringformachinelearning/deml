<div class="page-body page-body--catalog">
  <app-banner preheader="DEML" heading="Explore" [lede]="note()" />
  <app-page-section variant="catalog" labelledBy="explore-heading">
    <app-section-header
      eyebrow="Public"
      heading="Explore"
      [lede]="note()"
      headingId="explore-heading"
    />
    <app-dashboard-grid>
      @for (metric of metrics(); track metric.label) {
        <app-stat-card [label]="metric.label" [value]="metric.value" />
      }
    </app-dashboard-grid>
  </app-page-section>
</div>
