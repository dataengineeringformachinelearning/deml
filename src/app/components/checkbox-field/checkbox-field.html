<label class="checkbox-field" [attr.for]="controlId()">
  <input
    class="checkbox-field__input"
    [id]="controlId()"
    type="checkbox"
    [name]="name() || null"
    [required]="required()"
    [disabled]="disabled()"
    [checked]="checked()"
    (change)="onChange($event)"
  />
  <span class="checkbox-field__box" aria-hidden="true"></span>
  <span class="checkbox-field__label">{{ label() }}</span>
</label>
