<label class="text-field" [attr.for]="controlId()">
  <span class="text-field__label">
    {{ label() }}
    @if (required()) {
      <span class="text-field__required" aria-hidden="true">*</span>
    }
  </span>

  <input
    class="text-field__control"
    [id]="controlId()"
    [type]="type()"
    [name]="name() || null"
    [attr.autocomplete]="autocomplete() || null"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.aria-invalid]="invalid() ? true : null"
    [attr.aria-describedby]="invalid() ? controlId() + '-error' : hint() ? controlId() + '-hint' : null"
    (input)="onInput($event)"
  />

  @if (invalid()) {
    <span class="text-field__error" [id]="controlId() + '-error'" role="alert">{{ error() }}</span>
  } @else if (hint()) {
    <span class="text-field__hint" [id]="controlId() + '-hint'">{{ hint() }}</span>
  }
</label>
