<header
  id="navbar"
  class="site-navbar"
  [class.is-menu-open]="menuOpen()"
>
  <div id="site-navbar-branding" class="site-navbar-branding">
    <a
      class="site-navbar-icon"
      [routerLink]="brandHref()"
      [attr.aria-label]="brandLabel()"
      (click)="closeMenu()"
    >
      <svg lucideShip [size]="20" aria-hidden="true" focusable="false"></svg>
    </a>
  </div>

  <button
    #menuToggle
    type="button"
    class="site-navbar-menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-navbar-panel"
    aria-haspopup="true"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <svg lucideX [size]="32" aria-hidden="true" focusable="false"></svg>
    } @else {
      <svg lucideMenu [size]="32" aria-hidden="true" focusable="false"></svg>
    }
  </button>

  <div
    #menuPanel
    id="site-navbar-panel"
    class="site-navbar-panel"
    [attr.role]="menuOpen() ? 'dialog' : null"
    [attr.aria-modal]="menuOpen() ? true : null"
    [attr.aria-label]="menuOpen() ? 'Site menu' : null"
  >
    <div class="site-navbar-panel__inner">
      <nav id="site-navigation" class="main-navigation" aria-label="Primary">
        <ul id="site-navbar-menu" role="list">
          @for (link of navLinks(); track link.label) {
            <li>
              @if (link.href) {
                <a
                  [href]="link.href"
                  [attr.rel]="link.external ? 'noopener noreferrer' : null"
                  (click)="closeMenu()"
                >
                  {{ link.label }}
                </a>
              } @else if (link.path) {
                <a
                  [routerLink]="link.path"
                  routerLinkActive="is-active"
                  [routerLinkActiveOptions]="{ exact: link.path === '/' }"
                  ariaCurrentWhenActive="page"
                  (click)="closeMenu()"
                >
                  {{ link.label }}
                </a>
              }
            </li>
          }
        </ul>
      </nav>

      <div class="site-navbar-actions">
        <app-button-group id="site-button-group" align="end" layout="row">
          <app-theme-toggle />

          @if (!loggedIn()) {
            <app-button
              variant="primary"
              shape="pill"
              routerLink="/login"
              (pressed)="closeMenu(true)"
            >
              Log in
            </app-button>
          } @else {
            <app-button variant="secondary" shape="pill" (pressed)="logout()">Log out</app-button>
          }
        </app-button-group>
      </div>
    </div>
  </div>
</header>
