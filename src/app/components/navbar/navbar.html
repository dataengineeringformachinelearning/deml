<header
  id="navbar"
  class="site-navbar grid grid-cols-navbar items-center"
  [class.is-menu-open]="menuOpen()"
>

  <div id="site-navbar-branding" class="site-navbar-branding row items-center">
    <a
      href="/"
      target="_self"
      rel="noreferrer noopener"
      class="site-navbar-icon"
      aria-label="DEML Logo Link"
      (click)="closeMenu()"
    >
      <svg lucideBoxes [size]="32" aria-hidden="true" focusable="false"></svg>
    </a>
  </div>

  <button
    type="button"
    class="site-navbar-menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-navbar-menu"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <svg lucideX [size]="32" aria-hidden="true" focusable="false"></svg>
    } @else {
      <svg lucideMenu [size]="32" aria-hidden="true" focusable="false"></svg>
    }
  </button>

  <nav
    id="site-navigation"
    class="main-navigation place-center"
    aria-label="Primary"
  >
    <ul id="site-navbar-menu" class="row wrap items-center justify-center gap-4">
      <li class="item-fixed">
        <a
          href="/"
          target="_self"
          rel="noreferrer noopener"
          aria-label="DEML Home Navigation Link"
          (click)="closeMenu()"
        >
          Home
        </a>
      </li>
      <li class="item-fixed">
        <a
          href="/about/"
          target="_self"
          rel="noreferrer noopener"
          aria-label="DEML About Navigation Link"
          (click)="closeMenu()"
        >
          About
        </a>
      </li>
      <li class="item-fixed">
        <a
          href="/blog/"
          target="_self"
          rel="noreferrer noopener"
          aria-label="DEML Blog Navigation Link"
          (click)="closeMenu()"
        >
          Blog
        </a>
      </li>
    </ul>
  </nav>

  <div id="site-button-group" class="site-button-group place-end row wrap items-center justify-end gap-2">
    <button type="button" class="button">
      Log in
    </button>
  </div>

</header>
