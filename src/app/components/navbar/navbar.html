<header
  id="navbar"
  class="site-navbar items-center"
  [class.is-menu-open]="menuOpen()"
>
  <div id="site-navbar-branding" class="site-navbar-branding row items-center">
    <a
      class="site-navbar-icon"
      [routerLink]="brandHref()"
      [attr.aria-label]="brandLabel()"
      (click)="closeMenu()"
    >
      <svg lucideBoxes [size]="32" aria-hidden="true" focusable="false"></svg>
    </a>
  </div>

  <button
    #menuToggle
    type="button"
    class="site-navbar-menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="site-navbar-panel"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="toggleMenu()"
  >
    @if (menuOpen()) {
      <svg lucideX [size]="32" aria-hidden="true" focusable="false"></svg>
    } @else {
      <svg lucideMenu [size]="32" aria-hidden="true" focusable="false"></svg>
    }
  </button>

  <div #menuPanel id="site-navbar-panel" class="site-navbar-panel">
    <nav
      id="site-navigation"
      class="main-navigation place-center"
      aria-label="Primary"
    >
      <ul id="site-navbar-menu" class="row wrap items-center justify-center gap-4">
        @for (link of links(); track link.path) {
          <li class="item-fixed">
            <a
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <app-button-group id="site-button-group" align="end">
      <app-theme-toggle />

      @if (!loggedIn()) {
        <app-button variant="secondary" shape="pill" (click)="login()">Log in</app-button>
        <app-button variant="accent" shape="pill" (click)="login()">Sign up</app-button>
      } @else {
        <app-button variant="secondary" shape="pill" (click)="logout()">Log out</app-button>
      }
    </app-button-group>
  </div>
</header>
