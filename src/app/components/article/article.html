@if (hasEntry()) {
  <article class="article" [attr.aria-labelledby]="resolvedHeadingId()">
    <app-banner
      [preheader]="preheader()"
      [heading]="title()"
      [lede]="lede()"
      [headingId]="resolvedHeadingId()"
    >
      <app-button-group>
        <app-button variant="secondary" shape="pill" [routerLink]="backLink()">
          {{ backLabel() }}
        </app-button>
        <ng-content select="app-button" />
      </app-button-group>
    </app-banner>

    <div class="page-body page-body--prose article-body">
      @for (paragraph of body(); track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </article>
} @else {
  <div class="article article--missing">
    <app-banner
      [preheader]="preheader()"
      [heading]="missingHeading()"
      [lede]="missingLede()"
    >
      <app-button-group>
        <app-button variant="primary" shape="pill" [routerLink]="backLink()">
          {{ backLabel() }}
        </app-button>
      </app-button-group>
    </app-banner>

    <div class="page-body page-body--prose article-body" aria-hidden="true"></div>
  </div>
}
