<ul class="bar-chart" role="list" [attr.aria-label]="ariaLabel()">
  @for (row of rows(); track row.label) {
    <li class="bar-chart-row">
      <div class="bar-chart-meta">
        <span class="bar-chart-label">{{ row.label }}</span>
        <span class="bar-chart-value">{{ row.display }}</span>
      </div>
      <div class="bar-chart-track" aria-hidden="true">
        <div class="bar-chart-fill" [style.width.%]="row.pct"></div>
      </div>
    </li>
  }
</ul>
