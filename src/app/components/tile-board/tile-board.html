<!-- CHART RULES LOCKED: height fixed, width 100%, shared global scale – DO NOT CHANGE -->
<app-dashboard-grid>
  @for (tile of tiles(); track tile.id) {
    @switch (tile.kind) {
      @case ('stat') {
        <app-stat-card
          [size]="tile.size"
          [accent]="tile.accent"
          [label]="tile.label"
          [value]="tile.value"
          [delta]="tile.delta"
          [meta]="tile.meta"
          [sparkline]="tile.sparkline"
          [domain]="sharedDomain()"
        />
      }
      @case ('area') {
        <app-chart-card
          [size]="tile.size"
          [accent]="tile.accent"
          [heading]="tile.heading"
          [meta]="tile.meta"
        >
          <app-area-chart
            [points]="tile.points"
            [accent]="tile.accent"
            [domain]="sharedDomain()"
            [ariaLabel]="tile.ariaLabel"
          />
        </app-chart-card>
      }
      @case ('bar') {
        <app-chart-card
          [size]="tile.size"
          [accent]="tile.accent"
          [heading]="tile.heading"
          [meta]="tile.meta"
        >
          <app-bar-chart
            [items]="tile.items"
            [accent]="tile.accent"
            [ariaLabel]="tile.ariaLabel"
          />
        </app-chart-card>
      }
      @case ('metrics') {
        <app-chart-card
          [size]="tile.size"
          [accent]="tile.accent"
          [heading]="tile.heading"
          [meta]="tile.meta"
        >
          <app-metric-list
            [items]="tile.items"
            [accent]="tile.accent"
            [ariaLabel]="tile.ariaLabel"
          />
        </app-chart-card>
      }
    }
  }
</app-dashboard-grid>
