<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  [attr.aria-pressed]="theme() === 'dark'"
  (click)="toggleTheme()"
>
  @if (theme() === 'dark') {
    <svg lucideSun [size]="20" aria-hidden="true" focusable="false"></svg>
  } @else {
    <svg lucideMoon [size]="20" aria-hidden="true" focusable="false"></svg>
  }
</button>
