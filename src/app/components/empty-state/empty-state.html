<div class="empty-state" role="status">
  @if (eyebrow()) {
    <p class="empty-state__eyebrow">{{ eyebrow() }}</p>
  }
  <p class="empty-state__title">{{ title() }}</p>
  @if (description()) {
    <p class="empty-state__description">{{ description() }}</p>
  }
  <div class="empty-state__actions">
    <ng-content />
  </div>
</div>
