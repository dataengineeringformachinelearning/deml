<section
  class="page-body"
  [class.page-body--catalog]="variant() === 'catalog'"
  [class.page-body--prose]="variant() === 'prose'"
  [class.page-body--auth]="variant() === 'auth'"
  [attr.aria-label]="labelledBy() ? null : ariaLabel() || null"
  [attr.aria-labelledby]="labelledBy() || null"
>
  <ng-content />
</section>
