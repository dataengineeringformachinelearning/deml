<header class="section-header" [attr.aria-labelledby]="labelledBy()">
  @if (eyebrow(); as eye) {
    <p class="section-header-eyebrow type-eyebrow">{{ eye }}</p>
  }

  @switch (headingLevel()) {
    @case (3) {
      <h3 class="section-header-heading type-display" [id]="resolvedHeadingId()">
        {{ heading() }}
      </h3>
    }
    @case (4) {
      <h4 class="section-header-heading type-display" [id]="resolvedHeadingId()">
        {{ heading() }}
      </h4>
    }
    @case (5) {
      <h5 class="section-header-heading type-display" [id]="resolvedHeadingId()">
        {{ heading() }}
      </h5>
    }
    @case (6) {
      <h6 class="section-header-heading type-display" [id]="resolvedHeadingId()">
        {{ heading() }}
      </h6>
    }
    @default {
      <h2 class="section-header-heading type-display" [id]="resolvedHeadingId()">
        {{ heading() }}
      </h2>
    }
  }

  @if (lede(); as copy) {
    <p class="section-header-lede type-intro">{{ copy }}</p>
  }
</header>
