@if (visible(); as dialog) {
  @if (dialog.kind === 'confirm' && dialog.data) {
    <app-sheet
      [open]="true"
      [leaving]="leaving()"
      [title]="dialog.data.title"
      titleId="confirm-sheet-title"
      (dismissed)="cancel()"
    >
      @if (dialog.data.message) {
        <p>{{ dialog.data.message }}</p>
      }
      <app-button-group sheetFooter align="end" layout="column">
        <app-button
          variant="secondary"
          shape="pill"
          type="button"
          [disabled]="leaving()"
          (pressed)="cancel()"
        >
          {{ dialog.data.cancelBtnText || 'Cancel' }}
        </app-button>
        <app-button
          [variant]="dialog.data.tone === 'danger' ? 'accent' : 'primary'"
          shape="pill"
          type="button"
          [disabled]="leaving()"
          (pressed)="confirm()"
        >
          {{ dialog.data.confirmBtnText || 'Confirm' }}
        </app-button>
      </app-button-group>
    </app-sheet>
  }
}
