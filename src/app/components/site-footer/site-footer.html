<footer class="site-footer">
  <div class="site-footer__inner">
    <nav class="site-footer__directory" aria-label="Footer">
      @for (column of columns; track $index) {
        <div class="site-footer__column">
          @if (column.title) {
            <h2 class="site-footer__heading">{{ column.title }}</h2>
          }
          <ul class="site-footer__list">
            @for (link of column.links; track link.label) {
              <li>
                @if (link.routerLink && !isExternal(link)) {
                  <a [routerLink]="link.routerLink">{{ link.label }}</a>
                } @else {
                  <a
                    [href]="link.href"
                    [attr.target]="isExternal(link) ? '_blank' : null"
                    [attr.rel]="isExternal(link) ? 'noopener noreferrer' : null"
                  >
                    {{ link.label }}
                  </a>
                }
              </li>
            }
          </ul>
        </div>
      }
    </nav>

    <div class="site-footer__bottom">
      <p class="site-footer__copy">© {{ year }} DEML</p>
    </div>
  </div>
</footer>
