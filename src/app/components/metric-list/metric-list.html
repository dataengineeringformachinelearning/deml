<ol class="metric-list" role="list" [attr.aria-label]="ariaLabel()">
  @for (item of items(); track item.label; let i = $index) {
    <li class="metric-list-item">
      <span class="metric-list-rank" aria-hidden="true">{{ i + 1 }}</span>
      <div class="metric-list-copy">
        <span class="metric-list-label">{{ item.label }}</span>
        @if (item.meta) {
          <span class="metric-list-meta">{{ item.meta }}</span>
        }
      </div>
      <span class="metric-list-value">{{ item.value }}</span>
    </li>
  }
</ol>
