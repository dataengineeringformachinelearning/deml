# Control-plane CI — shared packages first, then ordered quality → tests.
# Data-plane workloads are covered by FORJD CI.
# Config SoT: config/deml.catalog.json

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared packages + contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packages/deml-contracts/pyproject.toml

      - uses: astral-sh/setup-uv@v6

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate config catalog
        run: npm run validate:config

      - name: Build + validate use-case contracts
        run: npm run validate:contracts

      - name: Use-case coverage matrix
        run: |
          python -m pip install -e packages/deml-contracts
          pip install -r backend/requirements.txt
          python scripts/check_usecase_coverage.py

  quality:
    name: Quality gates
    needs: [shared]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate config catalog
        run: npm run validate:config

      - name: Ruff (backend + contracts + scripts)
        run: |
          uvx ruff@0.12.7 check backend packages/deml-contracts/src scripts
          uvx ruff@0.12.7 format --check backend packages/deml-contracts/src scripts

      - name: Semgrep SAST
        run: bash scripts/run_semgrep.sh

  backend:
    name: Backend tests
    needs: [shared]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../packages/deml-contracts
          pip install -r requirements.txt

      - name: Pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest --tb=short -q

  frontend:
    name: Frontend tests
    needs: [shared]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared contracts (first)
        run: npm run build:contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --watch=false
